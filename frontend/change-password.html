<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password · Staff Allocation Management System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-container"></div>
  <div class="main-area">
    <div id="topbar-container"></div>
    <div class="content" id="content">
      <div class="panel no-tabs" style="max-width:520px;">
        <h3 class="section-title" style="color:var(--text-dark);">Change Password</h3>

        <div id="step-password">
          <div class="field">
            <label>Current Password</label>
            <div class="input-wrap eye" id="current-pw-wrap"><input id="cp-current" type="password" placeholder="Enter current password"><button class="eye-btn" id="eye-current"></button></div>
          </div>
          <div class="field">
            <label>New Password</label>
            <div class="input-wrap eye"><input id="cp-new" type="password" placeholder="Enter new password"><button class="eye-btn" id="eye-new"></button></div>
            <div class="strength-bars"><span id="sb1"></span><span id="sb2"></span><span id="sb3"></span><span id="sb4"></span></div>
            <div class="field-note" id="strength-label"></div>
            <div class="field-note">Password must be at least 8 characters long and include a number, uppercase, lowercase letter, and special character.</div>
          </div>
          <div class="field">
            <label>Confirm New Password</label>
            <div class="input-wrap eye"><input id="cp-confirm" type="password" placeholder="Re-enter new password"><button class="eye-btn" id="eye-confirm"></button></div>
            <div class="field-note" id="match-note"></div>
          </div>
          <div id="error-slot-1"></div>
          <div class="form-actions" style="justify-content:flex-start;">
            <button class="btn btn-primary" id="send-code-btn">Send Verification Code</button>
            <button class="btn btn-outline" onclick="location.href='profile.html'">Cancel</button>
          </div>
        </div>

        <div id="step-otp" class="hidden">
          <div class="info-banner" id="otp-notice"></div>
          <div id="error-slot-2"></div>
          <div class="otp-row" style="justify-content:flex-start;">
            <input class="otp-box" maxlength="1" inputmode="numeric" data-idx="0">
            <input class="otp-box" maxlength="1" inputmode="numeric" data-idx="1">
            <input class="otp-box" maxlength="1" inputmode="numeric" data-idx="2">
            <input class="otp-box" maxlength="1" inputmode="numeric" data-idx="3">
            <input class="otp-box" maxlength="1" inputmode="numeric" data-idx="4">
            <input class="otp-box" maxlength="1" inputmode="numeric" data-idx="5">
          </div>
          <div class="resend-row" style="text-align:left;">Didn't get a code? <a id="resend-link">Resend code</a></div>
          <div class="form-actions" style="justify-content:flex-start;">
            <button class="btn btn-primary" id="confirm-code-btn">Confirm &amp; Change Password</button>
            <button class="btn btn-outline" id="back-btn">Back</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/change-password.js"></script>
</body>
</html>
