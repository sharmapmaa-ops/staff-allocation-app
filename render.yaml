databases:
  - name: staff-allocation-db
    plan: free
    databaseName: staff_allocation
    user: staff_allocation_user

services:
  - type: web
    name: staff-allocation-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: staff-allocation-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: TEMP_TOKEN_EXPIRES_IN
        value: "10m"
      - key: CORS_ORIGIN
        value: "https://staff-allocation-frontend.onrender.com"
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASS
        value: ""
      - key: SMTP_FROM
        value: "Staff Allocation <no-reply@example.com>"

  - type: web
    name: staff-allocation-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "echo 'no build step needed'"
    staticPublishPath: .
